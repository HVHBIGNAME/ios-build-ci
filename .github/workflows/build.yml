name: Build WhiteGram IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - whitegram-source-12.9.4

permissions:
  contents: read

jobs:
  build:
    name: WhiteGram ${{ matrix.source_version }} → 12.9.4
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_version: release-12.9.2
            app_version: "12.9.4"
            app_build: "34639"

    steps:
      - name: Клонировать официальные исходники Telegram
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: ${{ matrix.source_version }}
          path: telegram-ios
          submodules: recursive
          fetch-depth: 0

      - name: Выбрать Xcode ${{ matrix.source_version }}
        run: |
          xcode_version=$(python3 -c 'import json; print(json.load(open("telegram-ios/versions.json"))["xcode"])')
          echo "Требуется Xcode: $xcode_version"
          sudo xcode-select -s "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Подготовить канонический каталог исходников
        run: |
          set -euxo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE/telegram-ios" /Users/Shared/telegram-ios
          git -C /Users/Shared/telegram-ios submodule update --init --recursive

      - name: Применить публичный WhiteGram overlay
        run: |
          set -euxo pipefail
          rm -rf /Users/Shared/whitegram-public
          bash "$GITHUB_WORKSPACE/whitegram/apply-public-overlay.sh" \
            /Users/Shared/telegram-ios \
            /Users/Shared/whitegram-public

      - name: Настроить WhiteGram и версию 12.9.4
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/whitegram/configure.py" /Users/Shared/telegram-ios
          test "$(python3 -c 'import json; print(json.load(open("/Users/Shared/telegram-ios/versions.json"))["app"])')" = "${{ matrix.app_version }}"
          test "$(python3 -c 'import json; print(json.load(open("/Users/Shared/telegram-ios/build-system/appstore-configuration.json"))["bundle_id"])')" = "whitegram.telegra.Telegraph"

      - name: Собрать release IPA
        run: |
          set -euxo pipefail
          source_dir=/Users/Shared/telegram-ios
          bazel_user_root=/private/var/tmp/_bazel_containerhost
          cd "$source_dir"
          build_number="${{ matrix.app_build }}"
          echo "APP_VERSION=${{ matrix.app_version }}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$bazel_user_root" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$build_number" \
            --disableProvisioningProfiles
          mkdir -p build/artifacts
          if [[ -f bazel-bin/Telegram/Telegram.ipa ]]; then
            cp bazel-bin/Telegram/Telegram.ipa build/artifacts/Telegram.ipa
          else
            ipa_path=$(find -L bazel-out -type f -path '*/bin/Telegram/Telegram.ipa' -print -quit)
            test -n "$ipa_path"
            cp "$ipa_path" build/artifacts/Telegram.ipa
          fi
          test -s build/artifacts/Telegram.ipa
          staging_dir=$(mktemp -d)
          unzip -q build/artifacts/Telegram.ipa -d "$staging_dir"
          app_path="$staging_dir/Payload/Telegram.app"
          test -d "$app_path"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = "whitegram.telegra.Telegraph"
          python3 - "$staging_dir" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          staging = Path(sys.argv[1])
          app = staging / "Payload" / "Telegram.app"
          expected = "whitegram.telegra.Telegraph"
          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)
          if info.get("CFBundleIdentifier") != expected:
              raise SystemExit(f"unexpected main bundle id: {info.get('CFBundleIdentifier')}")
          for suffix in ("Share", "NotificationService", "NotificationContent", "SiriIntents", "Widget", "BroadcastUpload"):
              plist_path = app / "PlugIns" / f"{suffix}.appex" / "Info.plist"
              if plist_path.exists():
                  with plist_path.open("rb") as f:
                      plist = plistlib.load(f)
                  if plist.get("CFBundleIdentifier") != f"{expected}.{suffix}":
                      raise SystemExit(f"unexpected {suffix} bundle id: {plist.get('CFBundleIdentifier')}")
          print("WhiteGram bundle identifiers verified")
          PY
          rm -rf "$staging_dir"

      - name: Загрузить IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhiteGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-unsigned
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 30
