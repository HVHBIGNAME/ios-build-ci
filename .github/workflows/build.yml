name: Build WhiteGram IPA

on:
  workflow_dispatch:
    inputs:
      simulator_only:
        description: "Build and test the simulator without a device IPA"
        type: boolean
        default: false
      login_check:
        description: "Request login connectivity verification (disable during Telegram FLOOD_WAIT)"
        type: boolean
        default: true
  push:
    branches:
      - main
      - whitegram-source-12.9.4

permissions:
  contents: read

jobs:
  build:
    name: WhiteGram ${{ matrix.source_version }}
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_version: release-13.0.0
            source_revision: f1dd7a2dbd02cbbf513e75d5695d8d36d1cf5838
            app_version: "13.0"
            app_build: "34649"

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          path: .

      - name: Set up source validation tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Клонировать официальные исходники Telegram
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: ${{ matrix.source_revision }}
          path: telegram-ios
          submodules: recursive
          fetch-depth: 0

      - name: Выбрать Xcode ${{ matrix.source_version }}
        run: |
          xcode_version=$(python3 -c 'import json; print(json.load(open("telegram-ios/versions.json"))["xcode"])')
          echo "Требуется Xcode: $xcode_version"
          sudo xcode-select -s "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Подготовить канонический каталог исходников
        run: |
          set -euxo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE/telegram-ios" /Users/Shared/telegram-ios
          git -C /Users/Shared/telegram-ios submodule update --init --recursive
          test "$(git -C /Users/Shared/telegram-ios rev-parse HEAD)" = "${{ matrix.source_revision }}"
          test "$(python3 -c 'import json; print(json.load(open("whitegram/upstream.json"))["source_sha"])')" = "${{ matrix.source_revision }}"

      - name: Применить публичный WhiteGram overlay
        run: |
          set -euxo pipefail
          rm -rf /Users/Shared/whitegram-public
          bash "$GITHUB_WORKSPACE/whitegram/apply-public-overlay.sh" \
            /Users/Shared/telegram-ios \
            /Users/Shared/whitegram-public

      - name: Применить совместимость WhiteGram с Telegram
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/whitegram/compat-12.9.4.py" \
            /Users/Shared/telegram-ios \
            /Users/Shared/whitegram-public

      - name: Set up JavaScript plugin tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source integration and plugin contracts
        env:
          WHITEGRAM_ASSEMBLED_SOURCE: /Users/Shared/telegram-ios
          WHITEGRAM_PUBLIC_SOURCE: /Users/Shared/whitegram-public
          WHITEGRAM_APPEARANCE_SOURCE: /Users/Shared/telegram-ios
          WHITEGRAM_VOICE_SOURCE: /Users/Shared/telegram-ios
          WHITEGRAM_VOICE_PUBLIC_SOURCE: /Users/Shared/whitegram-public
          WHITEGRAM_PLAYER_SOURCE: /Users/Shared/telegram-ios
          WHITEGRAM_ALTICON_TOOL: /Users/Shared/telegram-ios/build-system/bazel-rules/rules_apple/tools/alticonstool/alticonstool.py
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/whitegram-check-env"
          python="$RUNNER_TEMP/whitegram-check-env/bin/python"
          "$python" -m pip install -r whitegram/requirements-checks.txt
          "$python" -B -m unittest discover -s whitegram/tests -p 'test_*.py' -v
          "$python" -B -m unittest discover -s whitegram/tests/voice -p 'test_*.py' -v
          "$python" -B -m unittest discover -s whitegram/tests/player -p 'test_*.py' -v
          node --test whitegram/tests/plugins/bootstrap.test.cjs whitegram/tests/plugins/hooks.test.cjs
          "$python" -B whitegram/tests/plugins/check_swift_syntax.py
          "$python" -B whitegram/tests/plugins/check_hook_patches.py /Users/Shared/telegram-ios
          "$python" -B whitegram/tests/services/check_sources.py --target /Users/Shared/telegram-ios
          "$python" -B whitegram/tests/settings_transfer/check_sources.py --target /Users/Shared/telegram-ios
          "$python" -B whitegram/validate_port.py /Users/Shared/telegram-ios --report "$RUNNER_TEMP/whitegram-source-validation.json"

      - name: Run native Swift suites
        id: native_checks
        continue-on-error: ${{ inputs.simulator_only == true }}
        run: |
          set -euo pipefail
          failed=0
          python3 -B whitegram/tests/services/run_swift_tests.py || failed=1
          python3 -B whitegram/tests/plugins/run_native.py || failed=1
          python3 -B whitegram/tests/history/run_native.py || failed=1
          python3 -B whitegram/tests/settings_transfer/run_native.py --assembled-source /Users/Shared/telegram-ios || failed=1
          python3 -B whitegram/tests/translation/run_native.py || failed=1
          python3 -B whitegram/tests/localization/run_native.py || failed=1
          python3 -B whitegram/tests/privacy/run_native.py || failed=1
          python3 -B whitegram/tests/accounts/run_native.py || failed=1
          python3 -B whitegram/tests/backend/run_native.py || failed=1
          python3 -B whitegram/tests/system/run_native.py || failed=1
          python3 -B whitegram/tests/appearance_parity/run_native.py || failed=1
          python3 -B whitegram/tests/profile_metadata/run_native.py || failed=1
          python3 -B whitegram/tests/diagnostics/run_native.py || failed=1
          python3 -B whitegram/tests/media/run_native.py || failed=1
          python3 -B whitegram/tests/voice/run_native.py --require-swift || failed=1
          python3 -B whitegram/tests/player/run_native.py --require-swift || failed=1
          exit "$failed"

      - name: Upload source validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhiteGram-source-validation
          path: ${{ runner.temp }}/whitegram-source-validation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Настроить WhiteGram и проверить версию Telegram
        env:
          WHITEGRAM_TELEGRAM_API_ID: ${{ secrets.WHITEGRAM_TELEGRAM_API_ID }}
          WHITEGRAM_TELEGRAM_API_HASH: ${{ secrets.WHITEGRAM_TELEGRAM_API_HASH }}
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/whitegram/configure.py" /Users/Shared/telegram-ios
          test "$(python3 -c 'import json; print(json.load(open("/Users/Shared/telegram-ios/versions.json"))["app"])')" = "${{ matrix.app_version }}"
          test "$(python3 -c 'import json; print(json.load(open("/Users/Shared/telegram-ios/build-system/appstore-configuration.json"))["bundle_id"])')" = "ph.telegra.Telegraph"
          test "$(python3 -c 'import json; print(json.load(open("/Users/Shared/telegram-ios/build-system/appstore-configuration.json"))["enable_icloud"])')" = "False"

      - name: Restore Bazel disk cache
        id: bazel_cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/whitegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.source_version }}-${{ hashFiles('telegram-ios/versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.source_version }}-${{ hashFiles('telegram-ios/versions.json') }}-

      - name: Собрать release IPA
        if: ${{ !inputs.simulator_only }}
        env:
          WHITEGRAM_BACKEND_APPLICATION_KEY: ${{ secrets.WHITEGRAM_BACKEND_APPLICATION_KEY }}
          WHITEGRAM_DIAGNOSTICS_URL: ${{ secrets.WHITEGRAM_DIAGNOSTICS_URL }}
          WHITEGRAM_DIAGNOSTICS_UPLOAD_KEY: ${{ secrets.WHITEGRAM_DIAGNOSTICS_UPLOAD_KEY }}
        run: |
          set -euxo pipefail
          source_dir=/Users/Shared/telegram-ios
          bazel_user_root=/private/var/tmp/_bazel_containerhost
          cd "$source_dir"
          build_number="${{ matrix.app_build }}"
          echo "APP_VERSION=${{ matrix.app_version }}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$bazel_user_root" \
            --cacheDir=/Users/Shared/whitegram-bazel-cache \
            build \
            --continueOnError \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath=build/artifacts \
            --buildNumber="$build_number"
          mkdir -p build/artifacts
          if [[ -f bazel-bin/Telegram/Telegram.ipa ]]; then
            cp bazel-bin/Telegram/Telegram.ipa build/artifacts/Telegram.ipa
          else
            ipa_path=$(find -L bazel-out -type f -path '*/bin/Telegram/Telegram.ipa' -print -quit)
            test -n "$ipa_path"
            cp "$ipa_path" build/artifacts/Telegram.ipa
          fi
          test -s build/artifacts/Telegram.ipa
          staging_dir=$(mktemp -d)
          unzip -q build/artifacts/Telegram.ipa -d "$staging_dir"
          python3 "$GITHUB_WORKSPACE/whitegram/postprocess.py" "$staging_dir"
          app_path="$staging_dir/Payload/Telegram.app"
          test -d "$app_path"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = "whitegram.telegra.Telegraph"
          python3 - "$staging_dir" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          staging = Path(sys.argv[1])
          app = staging / "Payload" / "Telegram.app"
          expected = "whitegram.telegra.Telegraph"
          with (app / "Info.plist").open("rb") as f:
              info = plistlib.load(f)
          if info.get("CFBundleIdentifier") != expected:
              raise SystemExit(f"unexpected main bundle id: {info.get('CFBundleIdentifier')}")
          for suffix in ("Share", "NotificationService", "NotificationContent", "SiriIntents", "Widget", "BroadcastUpload"):
              plist_path = app / "PlugIns" / f"{suffix}.appex" / "Info.plist"
              if plist_path.exists():
                  with plist_path.open("rb") as f:
                      plist = plistlib.load(f)
                  if plist.get("CFBundleIdentifier") != f"{expected}.{suffix}":
                      raise SystemExit(f"unexpected {suffix} bundle id: {plist.get('CFBundleIdentifier')}")
          print("WhiteGram bundle identifiers verified")
          PY
          cd "$staging_dir"
          output_ipa="$source_dir/build/artifacts/WhiteGram-${{ matrix.app_version }}-$build_number.ipa"
          zip -qry "$output_ipa" Payload
          cd "$source_dir"
          test -s "$output_ipa"
          python3 "$GITHUB_WORKSPACE/whitegram/verify_ipa.py" "$output_ipa" \
            --repository "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --version "${{ matrix.app_version }}" --build "$build_number" \
            --require-diagnostics \
            --require-original-icon \
            --require-restored-icons \
            --report build/artifacts/WhiteGram-verification.json
          rm -rf "$staging_dir"

      - name: Загрузить IPA
        if: ${{ !inputs.simulator_only }}
        uses: actions/upload-artifact@v4
        with:
          name: WhiteGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-unsigned
          path: |
            /Users/Shared/telegram-ios/build/artifacts/WhiteGram-*.ipa
            /Users/Shared/telegram-ios/build/artifacts/WhiteGram-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload matching debug symbols
        if: ${{ !inputs.simulator_only }}
        uses: actions/upload-artifact@v4
        with:
          name: WhiteGram-symbols-${{ github.sha }}
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build and smoke-test simulator launches
        timeout-minutes: 150
        env:
          WHITEGRAM_RUN_LOGIN_CHECK: ${{ github.event_name != 'workflow_dispatch' || inputs.login_check }}
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          cd /Users/Shared/telegram-ios
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            --cacheDir=/Users/Shared/whitegram-bazel-cache \
            build \
            --continueOnError \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_sim_arm64 \
            --buildNumber="${{ matrix.app_build }}"
          test -s bazel-bin/Telegram/Telegram.ipa
          staging_dir=$(mktemp -d "$RUNNER_TEMP/whitegram-simulator.XXXXXX")
          trap 'rm -rf "$staging_dir"' EXIT
          unzip -q bazel-bin/Telegram/Telegram.ipa -d "$staging_dir"
          python3 "$GITHUB_WORKSPACE/whitegram/postprocess.py" "$staging_dir"
          set --
          if [[ "$WHITEGRAM_RUN_LOGIN_CHECK" == "true" ]]; then set -- --login; fi
          python3 -B "$GITHUB_WORKSPACE/whitegram/simulator_smoke.py" \
            --app "$staging_dir/Payload/Telegram.app" \
            --output "$RUNNER_TEMP/whitegram-simulator-launch" \
            --revision "$GITHUB_SHA" --build "${{ matrix.app_build }}" --seconds 30 "$@"

      - name: Upload simulator launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhiteGram-simulator-launch-${{ github.sha }}
          path: ${{ runner.temp }}/whitegram-simulator-launch/
          if-no-files-found: warn
          retention-days: 30

      - name: Save Bazel disk cache
        if: always() && steps.bazel_cache.outcome == 'success' && steps.bazel_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/whitegram-bazel-cache
          key: ${{ steps.bazel_cache.outputs.cache-primary-key }}

      - name: Preserve native regression failure after simulator diagnostics
        if: always() && steps.native_checks.outcome == 'failure'
        run: exit 1
